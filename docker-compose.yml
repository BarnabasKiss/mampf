services:
  meal-planner:
    # Verwende "image:" für das vorgebaute GHCR-Image (CasaOS/Produktion).
    # Kommentiere "image:" aus und nutze "build: ." für lokales Bauen:
    image: ghcr.io/barnabaskiss/mampf:latest
    # build: .
    container_name: meal-planner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_PATH: /app/data/meals.sqlite
    volumes:
      - ./data:/app/data