services:
  meal-planner:
    # Verwende "build: ." für lokales Bauen, oder kommentiere build aus
    # und verwende das GHCR-Image für CasaOS:
    # image: ghcr.io/BarnabasKiss/mapfmapf/meal-planner:latest
    build: .
    container_name: meal-planner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_PATH: /app/data/meals.sqlite
    volumes:
      - ./data:/app/data